<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Guild roster, party assignments, roles, and attendance." />
  <meta name="color-scheme" content="dark light" />
  <title>TRIAD | Members</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo/triad-mark-on-light.svg" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/svg+xml" href="assets/logo/triad-mark-on-dark.svg" media="(prefers-color-scheme: dark)" />
  <script>
    (() => {
      try {
        const saved = localStorage.getItem('triad-theme');
        const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.dataset.theme = saved || (prefersLight ? 'light' : 'dark');
      } catch (_) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="TRIAD Home">
      <span class="brand-logo ">
        <img class="logo-on-dark" src="assets/logo/triad-mark-on-dark.svg" alt="" />
        <img class="logo-on-light" src="assets/logo/triad-mark-on-light.svg" alt="" />
      </span>
      <span class="brand-word">TRIAD</span>
    </a>
    <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">MENU</button>
    <nav class="site-nav" aria-label="Primary navigation">
      <a href="index.html">Home</a>
      <a class="active" href="members.html">Members</a>
      <a href="events.html">Events</a>
      <a href="bidding.html">Bidding</a>
      <a href="guides.html">Guides</a>
      <a href="planner.html">EO / GL Planner</a>
      <button class="theme-toggle" type="button" data-theme-toggle>LIGHT</button>
    </nav>
  </header>
  <main class="page">
    <section class="page-header">
      <p class="eyebrow"><span class="section-marker">⟁</span>TRIAD — MEMBERS</p>
      <h1>Members</h1>
      <p>Guild roster, party assignments, roles, and attendance.</p>
    </section>
    <section class="section">
      <h2>Roster</h2>
      <div class="placeholder">Member data will live here. We can add classes, roles, raid groups, attendance status, and officer notes.</div>
    </section>
  </main>
  <footer>
    <span class="footer-brand"><span class="brand-logo ">
        <img class="logo-on-dark" src="assets/logo/triad-mark-on-dark.svg" alt="" />
        <img class="logo-on-light" src="assets/logo/triad-mark-on-light.svg" alt="" />
      </span><span>TRIAD</span></span>
    <span>Members</span>
  </footer>
  <script src="js/main.js"></script>
</body>
</html>
