<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TRIAD member directory." />
  <meta name="color-scheme" content="dark light" />
  <title>TRIAD | Members</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo/triad-mark-on-light.svg" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/svg+xml" href="assets/logo/triad-mark-on-dark.svg" media="(prefers-color-scheme: dark)" />
  <script>
    (() => {
      try {
        const saved = localStorage.getItem('triad-theme');
        const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.dataset.theme = saved || (prefersLight ? 'light' : 'dark');
      } catch (_) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="TRIAD Home">
      <span class="brand-logo">
        <img class="logo-on-dark" src="assets/logo/triad-mark-on-dark.svg" alt="" />
        <img class="logo-on-light" src="assets/logo/triad-mark-on-light.svg" alt="" />
      </span>
      <span class="brand-word">TRIAD</span>
    </a>
    <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">MENU</button>
    <div class="header-menu" data-header-menu>
      <nav class="site-nav" aria-label="Primary navigation">
        <a class="" href="index.html">Home</a>
        <a class="member-only active" href="members.html">Members</a>
        <a class="" href="events.html">Events</a>
        <a class="staff-only" href="roster.html">Roster</a>
        <div class="nav-dropdown member-only" data-nav-dropdown>
          <button class="nav-dropdown-toggle" type="button" aria-expanded="false" data-nav-dropdown-toggle>
            Guild Essentials <span class="nav-caret" aria-hidden="true">▾</span>
          </button>
          <div class="nav-dropdown-menu">
            <a class="" href="bidding.html">Bidding</a>
            <a class="" href="guides.html">Guides</a>
            <a class="" href="planner.html">EO / GL Planner</a>
          </div>
        </div>
      </nav>
      <div class="account-nav" data-account-nav>
        <a class="login-link" data-login-link href="login.html">Login</a>
        <a class="profile-link member-session-only" href="profile.html">My Profile</a>
        <a class="logout-link member-session-only" href="/api/auth/logout">Logout</a>
        <button class="theme-toggle" type="button" data-theme-toggle>LIGHT</button>
      </div>
    </div>
  </header>
  <main class="page">
    <section class="page-header">
      <p class="eyebrow"><span class="section-marker">⟁</span>TRIAD — MEMBERS</p>
      <h1>Members</h1>
      <p>TRIAD member directory. Member combat stats remain private.</p>
    </section>
    <section class="section">
      <div class="section-heading-row">
        <div>
          <p class="eyebrow"><span class="section-marker">⟁</span>GUILD DIRECTORY</p>
          <h2>Member Directory</h2>
        </div>
        <p class="directory-count" data-member-count>Loading...</p>
      </div>
      <div class="member-directory" data-member-directory>
        <div class="placeholder">Loading TRIAD members...</div>
      </div>
    </section>
  </main>
  <footer>
    <span class="footer-brand"><span class="brand-logo ">
        <img class="logo-on-dark" src="assets/logo/triad-mark-on-dark.svg" alt="" />
        <img class="logo-on-light" src="assets/logo/triad-mark-on-light.svg" alt="" />
      </span><span>TRIAD</span></span>
    <span>Members</span>
  </footer>
  <script src="js/main.js"></script>
  <script src="js/members.js"></script>
</body>
</html>
