<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="color-scheme" content="dark light" />
  <title>TRIAD | Member Login</title>
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="TRIAD" />
  <meta property="og:title" content="TRIAD | Member Login" />
  <meta property="og:description" content="TRIAD Ragnarok Origin Classic member access." />
  <meta property="og:url" content="https://triad-guild.vercel.app/login.html" />
  <meta property="og:image" content="https://triad-guild.vercel.app/assets/social/triad-og-banner.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="TRIAD website announcement" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="TRIAD | Member Login" />
  <meta name="twitter:description" content="TRIAD Ragnarok Origin Classic member access." />
  <meta name="twitter:image" content="https://triad-guild.vercel.app/assets/social/triad-og-banner.jpg" />
  <link rel="icon" type="image/svg+xml" href="/assets/logo/triad-mark-on-light.svg" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/svg+xml" href="/assets/logo/triad-mark-on-dark.svg" media="(prefers-color-scheme: dark)" />
  <script>
    (() => {
      try {
        const saved = localStorage.getItem('triad-theme');
        const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.dataset.theme = saved || (prefersLight ? 'light' : 'dark');
      } catch (_) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="login-page-body">
  <main class="login-page">
    <section class="login-card">
      <div class="login-logo" aria-hidden="true">
        <img class="logo-on-dark" src="/assets/logo/triad-mark-on-dark.svg" alt="" />
        <img class="logo-on-light" src="/assets/logo/triad-mark-on-light.svg" alt="" />
      </div>
      <p class="eyebrow"><span class="section-marker">⟁</span>TRIAD — MEMBER ACCESS</p>
      <h1 class="login-title">TRIAD</h1>
      <p class="login-copy">Home and Events are open to everyone. Sign in with Discord to unlock the full TRIAD guild hub, including Members, Bidding, Guides, and the EO / GL Planner.</p>
      <p class="auth-error" id="auth-error" role="alert"></p>
      <a class="button primary" id="discord-login" href="/api/auth/login">Login with Discord</a>
      <p class="login-meta">Ragnarok Origin Classic · Guild Hub</p>
    </section>
  </main>

  <script src="/js/main.js"></script>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const next = params.get('next');
      const login = document.getElementById('discord-login');
      if (next && next.startsWith('/') && !next.startsWith('//')) {
        login.href = '/api/auth/login?next=' + encodeURIComponent(next);
      }

      const messages = {
        config: 'Discord login is not configured yet.',
        state: 'The login session expired. Please try again.',
        oauth: 'Discord sign-in failed. Please try again.',
        not_member: 'This Discord account is not a member of the TRIAD server.',
        role: 'Your Discord account does not have an approved TRIAD member role.'
      };

      const error = params.get('error');
      if (error && messages[error]) {
        const box = document.getElementById('auth-error');
        box.textContent = messages[error];
        box.classList.add('visible');
      }
    })();
  </script>
</body>
</html>
