name: Redirect GitHub Pages to TRIAD Vercel

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build redirect site
        run: |
          mkdir -p _site
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=https://triad-guild.vercel.app/"><title>TRIAD</title></head>
          <body><script>location.replace('https://triad-guild.vercel.app/' + location.search + location.hash)</script></body></html>
          EOF
          cat > _site/404.html <<'EOF'
          <!doctype html>
          <html><head><meta charset="utf-8"><title>TRIAD</title></head>
          <body><script>
          const path = location.pathname.replace(/^\/triad-guild/, '') || '/';
          location.replace('https://triad-guild.vercel.app' + path + location.search + location.hash);
          </script></body></html>
          EOF

      - name: Upload redirect site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
